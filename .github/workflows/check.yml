name: check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # tools/go.sum pins the lint tools, so they are cached with the modules
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - uses: extractions/setup-just@v4

      # Same recipes as a local `just check`: the justfile is the single source of truth.
      - name: Check formatting
        run: just fmt-check

      - name: Vet
        run: just vet

      - name: Lint
        run: just lint

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
