# Full configuration reference with all available options.
# Copy this file to .lazyenvrc in the directory you run lazyenv from, or to
# lazyenv/config.toml in your user config directory (~/.config on Linux) for
# global settings. `lazyenv --check-config` lists every search path.

# Behavior
recursive = false
show-secrets = false
no-backup = false
no-git-check = false
no-theme-bg = false               # keep the terminal's native background (transparent terminals)
no-mouse = false
read-only = false
session-summary = true            # print a recap of disk changes on exit. --read-only forces off.
sort = "position"                 # "position" | "alphabetical"
group = false                     # start with prefix grouping enabled (toggle at runtime with 'g')

# Built-in theme preset. Run `lazyenv --list-themes` to see the full list,
# or `lazyenv --themes` for an interactive preview.
# Omit to use auto-detected dark/light defaults (same as default-dark/light).
# theme = "dracula"

# File detection patterns (glob syntax).
# Exclude is checked first; then include.
[files]
include = [".env", ".env.*", "*.env"]
exclude = ["*.bak"]

# Layout tuning — all values in characters.
[layout]
var-list-max-key-width = 30
diff-max-key-width = 25
matrix-key-width = 20
matrix-col-width = 14
var-list-min-value-width = 10
var-list-padding = 12                # min 8; lower values are raised
diff-min-value-width = 8
diff-padding = 10                    # min 9; lower values are raised
file-list-width = 0                  # 0 = auto (1/4 screen), > 0 = fixed width; min 20, lower values are raised
mouse-scroll-lines = 1               # lines per mouse wheel event

# Secret detection tuning.
# Pattern convention: "_HOST" → suffix, "PUBLIC_" → prefix, "DATABASE_HOST" → exact.
[secrets]
# Key patterns to never treat as secret (overrides built-in detection).
# safe_patterns = ["_HOST", "_URL", "_ENDPOINT"]
# Key patterns to always treat as secret (in addition to built-ins).
# extra_patterns = ["_CREDENTIAL"]
# Enable entropy-based value heuristic (flags random-looking values ≥16 chars).
value_heuristic = true

# Color overrides (hex). When using a theme, these override individual colors.
# Leave empty or omit to use the theme or auto-detected defaults.
[colors]
# primary = "#BD93F9"
# warning = "#FFB86C"
# error = "#FF5555"
# success = "#50FA7B"
# muted = "#6272A4"
# fg = "#F8F8F2"
# bg = "#282A36"
# border = "#44475A"
# cursor-bg = "#44475A"
# modified = "#FFB86C"
# added = "#50FA7B"
# deleted = "#FF5555"
